name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-linux:
    name: Tests (Linux, Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Einsatzcockpit.PrintAgent.slnx -c Release
      - run: dotnet test tests/Einsatzcockpit.PrintAgent.Tests -c Release --no-build
      - name: Installer-Tests (PowerShell)
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester tests/Installer.Tests.ps1 -CI

  windows:
    needs: test-linux
    name: Build + Tests (Windows) und Paket
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          # CalVer wie Einsatzcockpit: Release-Tag vJJJJ.MM.TT -> JJJJ.MM.TT,
          # sonst Datum des Builds + Laufnummer (JJJJ.MM.TT.N).
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $v = "$(Get-Date -Format yyyy.MM.dd).$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: dotnet test tests/Einsatzcockpit.PrintAgent.Tests -c Release
      - name: Installer-Tests (Windows PowerShell 5.1 und PowerShell 7)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester tests/Installer.Tests.ps1 -CI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -Command "Import-Module Pester -RequiredVersion 5.7.1; Invoke-Pester tests/Installer.Tests.ps1 -CI"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish (win-x64, self-contained, Single-File)
        run: >
          dotnet publish src/Einsatzcockpit.PrintAgent -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish
      - name: Tray ohne Schreibrechte auf Dienstverzeichnis starten
        shell: pwsh
        run: ./tests/Tray.Smoke.ps1 -Exe ./publish/EinsatzcockpitPrintAgent.exe
      - name: Paket packen
        shell: pwsh
        run: |
          Copy-Item installer/* publish/
          Copy-Item README.md publish/
          Copy-Item LICENSE publish/
          foreach ($name in @('EinsatzcockpitPrintAgent.exe','install.ps1','Install.Common.ps1','Installieren.cmd','update.ps1','README.md')) {
            if (-not (Test-Path "publish/$name")) { throw "Paket unvollstaendig: $name fehlt" }
          }
          Compress-Archive -Path publish/* -DestinationPath EinsatzcockpitPrintAgent-${{ steps.version.outputs.version }}-win-x64.zip
          $zip = Get-ChildItem EinsatzcockpitPrintAgent-*-win-x64.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -NoNewline SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EinsatzcockpitPrintAgent-win-x64
          path: |
            EinsatzcockpitPrintAgent-*.zip
            SHA256SUMS.txt
      - name: Release (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Einsatzcockpit Druckagent ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            EinsatzcockpitPrintAgent-*.zip
            SHA256SUMS.txt
